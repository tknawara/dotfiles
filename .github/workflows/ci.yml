name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install grip
        run: curl -fsSL https://gripsack.dev/install.sh | sh

      # grip check = eval + IR sema + config linters, zero side effects —
      # the CI gate for an env repo. A local checkout needs no approval.
      - name: grip check
        env:
          # authenticated api.github.com — anonymous rate limits flake
          # on shared runners when linters or resolvers touch the API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ~/.local/bin/grip check
