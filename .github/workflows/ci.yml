name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install grip
        run: curl -fsSL https://gripsack.dev/install.sh | sh

      # grip check = eval + IR sema + config linters, zero side effects —
      # the CI gate for an env repo. CI has no TTY for the trust prompt, so
      # it approves exactly the bundle/policy digests of this checkout.
      - name: grip check
        env:
          # authenticated api.github.com — anonymous rate limits flake
          # on shared runners when linters or resolvers touch the API
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          trust=$(grip trust inspect --json)
          grip trust add \
            --bundle "$(jq -r .bundle_digest <<<"$trust")" \
            --policy "$(jq -r .policy_digest <<<"$trust")"
          grip check
