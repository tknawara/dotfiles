"$schema" = 'https://starship.rs/config-schema.json'
# Retro AMBER (green variant) — Catppuccin Mocha
#   TAREK :: ~/workspace/gripsack :: main*
#   ▶

palette = 'catppuccin_mocha'
right_format = "$time"
add_newline = true

format = """
[TAREK](bold green)\
[ :: ](overlay0)$directory\
$git_branch$git_status\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "teal"
before_repo_root_style = "subtext0"
repo_root_style = "bold teal"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style)"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 6
truncate_to_repo = false
fish_style_pwd_dir_length = 1
truncation_symbol = ""
read_only = " [ro]"
read_only_style = "red"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](overlay0)"

[git_branch]
style = "yellow"
format = "[ :: ](overlay0)[$branch]($style)"

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style))"
modified = "*"
staged = "+"
untracked = "?"
deleted = "-"
renamed = "»"
conflicted = "="
stashed = ""
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"

[cmd_duration]
min_time = 2000
format = "[ :: ](overlay0)[$duration](subtext0)"

[character]
success_symbol = "[▶](bold green)"
error_symbol   = "[▶](bold red)"
vimcmd_symbol  = "[◀](bold green)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
