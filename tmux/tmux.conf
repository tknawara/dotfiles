# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*-256color:Tc"

# Enable mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar position and refresh
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre

# Catppuccin Mocha colors
# https://github.com/catppuccin/catppuccin
set -g @ctp_rosewater "#f5e0dc"
set -g @ctp_flamingo "#f2cdcd"
set -g @ctp_pink "#f5c2e7"
set -g @ctp_mauve "#cba6f7"
set -g @ctp_red "#f38ba8"
set -g @ctp_maroon "#eba0ac"
set -g @ctp_peach "#fab387"
set -g @ctp_yellow "#f9e2af"
set -g @ctp_green "#a6e3a1"
set -g @ctp_teal "#94e2d5"
set -g @ctp_sky "#89dceb"
set -g @ctp_sapphire "#74c7ec"
set -g @ctp_blue "#89b4fa"
set -g @ctp_lavender "#b4befe"
set -g @ctp_text "#cdd6f4"
set -g @ctp_subtext1 "#bac2de"
set -g @ctp_subtext0 "#a6adc8"
set -g @ctp_overlay2 "#9399b2"
set -g @ctp_overlay1 "#7f849c"
set -g @ctp_overlay0 "#6c7086"
set -g @ctp_surface2 "#585b70"
set -g @ctp_surface1 "#45475a"
set -g @ctp_surface0 "#313244"
set -g @ctp_base "#1e1e2e"
set -g @ctp_mantle "#181825"
set -g @ctp_crust "#11111b"

# Status bar style (transparent-ish with Mocha colors)
set -g status-style "bg=#{@ctp_mantle},fg=#{@ctp_text}"
set -g message-style "bg=#{@ctp_surface0},fg=#{@ctp_text}"
set -g message-command-style "bg=#{@ctp_surface0},fg=#{@ctp_text}"

# Pane borders
set -g pane-border-style "fg=#{@ctp_surface0}"
set -g pane-active-border-style "fg=#{@ctp_lavender}"

# Window status
set -g window-status-format " #[fg=#{@ctp_overlay1}]#{?window_active,#[fg=#{@ctp_lavender}],}#{?window_zoomed_flag,󰁌 ,}#{?window_last_flag,󰁯 ,}#I:#W "
set -g window-status-current-format " #[fg=#{@ctp_mantle},bg=#{@ctp_lavender}] #[fg=#{@ctp_mantle}]#{?window_zoomed_flag,󰁌 ,}#I:#W #[fg=#{@ctp_lavender},bg=#{@ctp_mantle}] "
set -g window-status-separator ""

# Left status: rounded session icon + name
set -g status-left-length 100
set -g status-left "#[fg=#{@ctp_mantle},bg=#{@ctp_mauve}] 󰖯 #S #[fg=#{@ctp_mauve},bg=#{@ctp_surface0}] #[fg=#{@ctp_text},bg=#{@ctp_surface0}] 󰣇 #{host} #[fg=#{@ctp_surface0},bg=#{@ctp_mantle}] "

# Right status: clock + rounded end
set -g status-right-length 100
set -g status-right "#[fg=#{@ctp_surface0},bg=#{@ctp_mantle}] #[fg=#{@ctp_text},bg=#{@ctp_surface0}] 󰥔 %H:%M #[fg=#{@ctp_sapphire},bg=#{@ctp_surface0}] #[fg=#{@ctp_mantle},bg=#{@ctp_sapphire}] 󰃭 %a %d %b "

# Clock mode
setw -g clock-mode-colour "#{@ctp_lavender}"

# Copy mode
setw -g mode-style "fg=#{@ctp_text},bg=#{@ctp_surface0}"

# Escape time for nvim
set -sg escape-time 10
