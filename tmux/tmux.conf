# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*-256color:Tc"

# Enable mouse
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Prefix key
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Split windows
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-justify centre

# Catppuccin theme settings
set -g @catppuccin_flavor "mocha"
# Status bar background (use theme color, not transparent)
set -g @catppuccin_status_background "#181825"

# Window style
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_flags "icon"

# Status modules
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_host} #{E:@catppuccin_status_date_time}"

# Module text overrides
set -g @catppuccin_session_icon "󰖯"
set -g @catppuccin_host_icon "󰒋"
set -g @catppuccin_date_time_icon "󰥔"
set -g @catppuccin_date_time_text " %H:%M"

# Pane borders
set -g @catppuccin_pane_active_border_style "fg=#b4befe"
set -g @catppuccin_pane_border_style "fg=#313244"

# Clock mode
setw -g clock-mode-colour "#b4befe"

# Escape time for nvim
set -sg escape-time 10

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Initialize TPM (keep this line at the bottom)
run '~/.config/tmux/plugins/tpm/tpm'
